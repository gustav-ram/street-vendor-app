name: streeteats

services:
  db:
    # Multi-arch build of the official docker-postgis image (postgis/postgis is amd64-only).
    image: imresamu/postgis:17-3.6-alpine
    environment:
      POSTGRES_USER: streeteats
      POSTGRES_PASSWORD: streeteats
      POSTGRES_DB: streeteats
    ports:
      # Bound to loopback only: the database is never reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init/01-create-test-db.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro
    # Privacy: never write SQL statements (which could contain coordinates)
    # to the server log, not even for failing queries.
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_min_duration_statement=-1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streeteats -d streeteats"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
